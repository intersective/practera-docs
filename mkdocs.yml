site_name: Support Center
site_description: Comprehensive support documentation for Practera users
site_author: Practera Team
site_url: https://support.practera.com
extra:
  assets_dir: assets
theme:
  name: material
  language: en
  logo: stylesheets/logo.png
  favicon: stylesheets/logo.ico
  features:
  - navigation.tabs
  - navigation.top
  - navigation.indexes
  - navigation.sections
  - navigation.tracking
  - toc.integrate
  - toc.follow
  - navigation.instant
  - navigation.footer
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: blue
  font:
    text: Roboto
    code: Roboto Mono
extra_css:
- stylesheets/extra.css
extra_javascript:
- stylesheets/force-toc.js
- stylesheets/extra.js
